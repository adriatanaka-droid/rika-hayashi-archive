  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500&display=swap" rel="stylesheet">
  <style>
    :root{--paper:#f1eee5;--ink:#292b27;--muted:#77786f;--moss:#68705b;--line:rgba(41,43,39,.16);--display:"Cormorant Garamond",Georgia,serif;--body:"Source Serif 4",Georgia,serif}
    :root[data-theme="dark"]{color-scheme:dark;--paper:#262824;--ink:#e7e4da;--muted:#aaa99f;--moss:#9eaa8c;--line:rgba(231,228,218,.16)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-weight:300;line-height:1.85;-webkit-font-smoothing:antialiased;transition:background-color .7s,color .7s}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.32;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.055'/%3E%3C/svg%3E")}
    .top{display:flex;justify-content:space-between;align-items:center;padding:1.4rem clamp(1.2rem,4vw,3rem)}.back,.theme{border:0;background:none;color:var(--muted);font:300 .67rem var(--body);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;cursor:pointer}.back:hover,.theme:hover{color:var(--ink)}
    article{width:min(86vw,720px);margin:clamp(4.5rem,10vh,7rem) auto clamp(4.5rem,10vh,7rem)}.meta{color:var(--moss);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase}.title{font:400 clamp(2.2rem,5.5vw,4.2rem)/.95 var(--display);letter-spacing:-.035em;margin:1rem 0 3rem}.abstract{font-size:clamp(1.15rem,2.2vw,1.45rem);line-height:1.75;color:var(--muted);padding-bottom:3.5rem;border-bottom:1px solid var(--line)}.body{margin-top:3.5rem;font-size:1.05rem}.placeholder{color:var(--muted);font-style:italic}
  </style>
</head>
<body>
  <header class="top"><a class="back" href="index.html#archive">← Archive</a><button class="theme" type="button">Dark</button></header>
  <article><div class="meta" id="meta"></div><h1 class="title" id="title"></h1><p class="abstract" id="abstract"></p><div class="body"><p class="placeholder">Essay text forthcoming.</p></div></article>
  <script>
    const essays={
      'unasked-question':['The Weight of an Unasked Question','Philosophy','12 Jun 2026','On the moral life of uncertainty, and what becomes possible when we learn to remain beside a question.'],
      'law-after-certainty':['Law After Certainty','Law','28 Apr 2026','A reflection on judgment, ambiguity, and the quiet human assumptions held inside legal systems.'],
      'ordinary-tuesday':['Rituals for an Ordinary Tuesday','Anthropology','03 Mar 2026','The small repeated gestures through which a life acquires shape, memory, and meaning.'],
      'machine-prayer':['The Machine at the Edge of Prayer','Technology','19 Jan 2026','What our tools reveal about longing, attention, and the parts of being human we cannot automate.'],
      'less-certain':['Notes on Becoming Less Certain','Personal Journal','30 Nov 2025',"A field note from the slow work of changing one's mind without abandoning one's center."]
    };
    const essay=essays[new URLSearchParams(location.search).get('essay')]||essays['unasked-question'];
    document.title=essay[0]+' — Rika Hayashi';document.getElementById('title').textContent=essay[0];document.getElementById('meta').textContent=essay[1]+' · '+essay[2];document.getElementById('abstract').textContent=essay[3];
    const toggle=document.querySelector('.theme');let stored=null;try{stored=sessionStorage.getItem('rika-theme')}catch{}function setTheme(t){document.documentElement.dataset.theme=t;toggle.textContent=t==='dark'?'Light':'Dark'}setTheme(stored||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));toggle.addEventListener('click',()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';setTheme(t);try{sessionStorage.setItem('rika-theme',t)}catch{}});
  </script>
</body>
</html>
