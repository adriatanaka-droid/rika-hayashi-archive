      'ants-brave-new-world':['Parallel between ants, Brave New World, and modern society.','Philosophy','03 Jun 2025','On specialization, technological stagnation, and what humanity risks losing when society begins to resemble an ant colony.',`<p>We humans have achieved many of the most unimaginable in the last century. We’ve explored the deepest seas and the highest mountains, the smallest particles and the broadest universe. However, hidden between every trophy on the shelf, something about this all has concerned me. We have reached a pivotal moment where the paths diverge. I am not here to cry that doomsday is around the clock like our old grandpa Nick Bostrom, nor choose to be completely oblivious of the dangers of our choices. I am simply here to give a possible objective assessment. What I am saying is that we should look back in time to cherish and reflect, but above all, also think about our future, humanity’s future.</p>
      <p>There are many theories out there about our future.</p>
      <p>One of the most realistic is described in Tyler Cowen’s book <em>The Great Stagnation</em>. In which he argues that the biggest, life-altering innovations have already happened — and they happened a long time ago, namely, between the 1870s and 1970s. In just one century, we doubled life expectancy, gave most people hot showers, and put a man on the Moon. We went from riding horses, sailing wooden ships, to tanks, automobiles, and submarines. That was the true era of transformation &amp; innovation. And if you ask the people who lived their prime ages through that era, you would hear a vastly different narrative compared to us, Gen Z, where every “new phone release” just seems like the same as before. You can argue that there are REVOLUTIONARY improvements in certain techs like AI models, but as Economist Robert Gordon puts it, “The washing machine will change more lives than iPhone ever will”. It is just complete child’s play.</p>
      <p>Another angle of this trend is that Today, we have more scientists and funding in STEM than ever, but fewer paradigm shifts occur. According to the study <em>Are Ideas Getting Harder to Find?</em>, Researcher input must double every 13 years just to maintain the same level of technological progress. We spend more on research than ever. But the results? Not more energy. Not better transportation. Not even longer lives. We’re innovating more, but we’re transforming less. And as Patrick Collison &amp; Ben Reinhardt call it, our “science (is) stuck in molasses.”</p>
      <p>And so it is inevitable for us to question why the slowdown?</p>
      <p>A simple answer that I propose is that our humanity is transforming into ant colonies. In the past, humans could be many things at once. You could be a physicist and a poet, a sailor and a biologist. During the Great Renaissance, you will find many famous figures who were experts in completely unrelated fields, name da Vinci, Michelangelo, and Galileo. You could drift, explore, collide with disciplines, and change them. Progress came from randomness, friction, and dreams.</p>
      <p>Now? We are told to specialize. Early, because it takes decades of studying now just to enter a field. We are trained to be efficient, optimized, and useful — tiny moving parts in a larger machine. Our society is turning into an ant colony, a superorganisms, where individuals can no longer functions only as themselves. Each ant performs one small, defined role endlessly, without deviation. And it works. Ants have survived for over a million years. But here’s the catch: ants don’t innovate. If you look at an ant colony from 2025 and compare it to a colony from 1000 BCE, it is not unpredictable that both still look largely the same and still follow trails of scents. They don’t dream. They survive by doing the same thing, the same way, forever.</p>
      <p>And when conditions change? Many colonies collapsed because they couldn’t adapt.</p>
      <p>Humans didn’t get here by being efficient. We got here by being chaotic. By imagining fire. By playing with sounds. By asking "what if" instead of "what works." When we turn human systems into ant-like structures, like the ones pictured in <em>Brave New World</em>, where social mobility decreases, where the cost of individual shifts increases, where specialization is the norm, we lose the very thing that made us different — the ability to change.</p>`]
    };
